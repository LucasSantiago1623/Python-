<!DOCTYPE html>
<html>



<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <title>{% block title %}{% endblock %} - Flask Menu</title>

</head>

<body>
    <div class="menu">
        <nav>
            <ul>
                <!-- url_for também é usado para navegar entre rotas do Flask -->
                <li><a href="{{ url_for('home') }}">Sobre mim</a></li>
                <li><a href="{{ url_for('page1') }}">Projetos para o futuro</a></li>
                <li><a href="{{ url_for('page2') }}">O que você gosta de fazer</a></li>
            </ul>
        </nav>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

</body>

</html>
